name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          rm -rf SocksProxy.xcodeproj
          xcodegen generate
      - name: Build
        run: |
          xcodebuild -project SocksProxy.xcodeproj \
            -scheme SocksProxy \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData/SocksProxy \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
      - name: Show errors on failure
        if: failure()
        run: |
          echo '=== LAST 60 LINES ==='
          tail -60 build.log || true
          echo '=== ERRORS ==='
          grep -i 'error:' build.log | grep -v 'CompileSwift' | head -20 || echo '(no errors found)'
      - name: Package IPA
        run: |
          echo 'Looking for .app in DerivedData...'
          find ~/Library/Developer/Xcode/DerivedData/SocksProxy -name '*.app' -type d 2>/dev/null
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/SocksProxy -name '*.app' -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo 'ERROR: No .app bundle found!'
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          timestamp=$(date +%Y%m%d%H%M%S)
          zip -r "SocksProxy_${timestamp}.ipa" Payload
          rm -rf Payload
          echo "IPA created: SocksProxy_${timestamp}.ipa"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SocksProxy-ipa
          path: 'SocksProxy_*.ipa'
