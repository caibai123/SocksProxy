name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove stale xcodeproj
        run: rm -rf SocksProxy.xcodeproj

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -project SocksProxy.xcodeproj -scheme SocksProxy

      - name: Build
        run: |
          xcodebuild -project SocksProxy.xcodeproj \n            -scheme SocksProxy \n            -configuration Release \n            -destination 'generic/platform=iOS' \n            -derivedDataPath ~/Library/Developer/Xcode/DerivedData/SocksProxy \n            CODE_SIGN_IDENTITY="" \n            CODE_SIGNING_REQUIRED=NO \n            CODE_SIGNING_ALLOWED=NO \n            build

      - name: Package IPA
        run: |
          APP_PATH=$(ls ~/Library/Developer/Xcode/DerivedData/SocksProxy/Build/Products/Release-iphoneos/*.app 2>/dev/null | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          timestamp=$(date +%Y%m%d%H%M%S)
          zip -r "SocksProxy_${timestamp}.ipa" Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SocksProxy-ipa
          path: |SocksProxy_*.ipa