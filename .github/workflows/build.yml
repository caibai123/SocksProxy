name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove stale xcodeproj
        run: rm -rf SocksProxy.xcodeproj
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project SocksProxy.xcodeproj
  -scheme SocksProxy
  -configuration Release
  -destination generic/platform=iOS
  -derivedDataPath ~/Library/Developer/Xcode/DerivedData/SocksProxy
  CODE_SIGN_IDENTITY=""
  CODE_SIGNING_REQUIRED=NO
  CODE_SIGNING_ALLOWED=NO
  build
      - name: Package IPA
        run: |
          APP_PATH=$(ls ~/Library/Developer/Xcode/DerivedData/SocksProxy/Build/Products/Release-iphoneos/*.app 2>/dev/null | head -1)
echo "APP_PATH=$APP_PATH"
mkdir -p Payload
cp -R "$APP_PATH" Payload/
timestamp=$(date +%Y%m%d%H%M%S)
zip -r "SocksProxy_${timestamp}.ipa" Payload
rm -rf Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SocksProxy-ipa
          path: SocksProxy_*.ipa