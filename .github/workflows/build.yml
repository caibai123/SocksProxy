name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Remove stale xcodeproj
        run: rm -rf SocksProxy.xcodeproj
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project SocksProxy.xcodeproj             -scheme SocksProxy             -configuration Release             -destination generic/platform=iOS             -derivedDataPath ~/Library/Developer/Xcode/DerivedData/SocksProxy             CODE_SIGN_IDENTITY=             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             build 2>&1 | tee build.log
      - name: Show build log on failure
        if: failure()
        run: |
          echo '=== LAST 100 LINES OF BUILD LOG ==='
          tail -100 build.log
          echo '=== SEARCHING FOR ERRORS ==='
          grep -i 'error:' build.log | head -20 || echo 'No error: lines found'
      - name: Package IPA
        if: success()
        run: |
          APP_PATH=$(ls ~/Library/Developer/Xcode/DerivedData/SocksProxy/Build/Products/Release-iphoneos/*.app 2>/dev/null | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "SocksProxy_$(date +%Y%m%d%H%M%S).ipa" Payload
          rm -rf Payload
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SocksProxy-ipa
          path: SocksProxy_*.ipa
